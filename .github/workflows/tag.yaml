name: Tag latest

on:
  schedule:
    - cron: "0 1 * * *" # Daily check
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (orcaslicer branch)
        uses: actions/checkout@v4
        with:
          ref: orcaslicer
          fetch-depth: 0

      - name: Tag the latest Orcaslicer if available
        id: tag_latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAGGER_NAME: GitHub Actions
          GIT_TAGGER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          chmod +x ./tag_latest_orcaslicer.sh
          ./tag_latest_orcaslicer.sh

      - name: Trigger build workflow for new tag
        if: steps.tag_latest.outputs.tag_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build_and_push_cr.yaml/dispatches" \
            -d '{"ref":"${{ steps.tag_latest.outputs.tag_name }}","inputs":{"tag_name":"${{ steps.tag_latest.outputs.tag_name }}"}}'
