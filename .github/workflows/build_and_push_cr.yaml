name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensure full history for tags

      # Resolve image tag name (use pushed tag when event is tag-triggered)
      - name: Resolve tag name
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            TAG_NAME="$(git describe --tags --abbrev=0 2>/dev/null || echo manual-${GITHUB_SHA::7})"
            echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          fi
          echo "Building image tags: latest and ${TAG_NAME}"

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orcaslicer-novnc:latest
            ghcr.io/${{ github.repository_owner }}/orcaslicer-novnc:${{ env.TAG_NAME }}
